# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'

# manual save/restore sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# automatic periodic save + restore after reboot
set -g @plugin 'tmux-plugins/tmux-continuum'

# status-line mode indicator. Declared so `prefix + I` installs it on a new
# machine -- it was previously only ever installed by hand, which left
# status-right referencing an interpolation that never resolved.
set -g @plugin 'dominikduda/tmux_mode_indicator'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# auto-start a fresh tmux server via systemd user service at (WSL2) startup
# so auto-restore runs deterministically instead of depending on the 10s
# "just started" window when you manually open tmux after a reboot
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'new-session -d'

# tmux_mode_indicator customizations
set -g @tmux_mode_indicator_prefix_pressed_text "PREFIX"
set -g @tmux_mode_indicator_copy_mode_text "COPY"
set -g @tmux_mode_indicator_normal_mode_text "."
set -g @tmux_mode_indicator_insert_mode_text "."
set -g @tmux_mode_indicator_separator "."
set -g @tmux_mode_indicator_background "#1e1e2e"
set -g @tmux_mode_indicator_normal_fg "#1e1e2e"
set -g @tmux_mode_indicator_separator_fg "#1e1e2e"
set -g @tmux_mode_indicator_prefix_pressed_bg "#f38ba8"
set -g @tmux_mode_indicator_prefix_pressed_fg "#1e1e2e"
set -g @tmux_mode_indicator_copy_mode_bg "#a6e3a1"
set -g @tmux_mode_indicator_copy_mode_fg "#1e1e2e"
set -g @tmux_mode_indicator_left_edge_character ""
set -g @tmux_mode_indicator_left_edge_character_bg "#1e1e2e"
set -g @tmux_mode_indicator_right_edge_character ""
set -g @tmux_mode_indicator_right_edge_character_bg "#1e1e2e"
set -g @tmux_mode_indicator_after_interpolation_bg "#1e1e2e"
set -g @tmux_mode_indicator_after_interpolation_fg "#cdd6f4"

# source the plugin with bash (system /bin/sh is dash, script needs bash)
run-shell 'bash ~/.tmux/plugins/tmux_mode_indicator/tmux_mode_indicator.tmux'


# switch windows using Ctrl+Shift+Left/Right without prefix
bind -n C-S-Left previous-window
bind -n C-S-Right next-window

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# ========================
# General Settings
# ========================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# rebind prefix from C-b to C-Space
unbind C-b
set -g prefix C-Space
set -g repeat-time 2000

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour '#89b4fa'

# copy mode
setw -g mode-style 'fg=#1e1e2e,bg=#89b4fa'

# panes
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'

# statusbar
# 15, not 1: tmux-continuum injects #(continuum_save.sh) into status-right, and tmux
# re-runs every #() in the status line once per status-interval. At 1 that forked a
# shell script every single second, forever. 15 is what continuum's README recommends.
set -g status-interval 15
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#cdd6f4,bg=#1e1e2e'

set -g status-left '#[fg=#1e1e2e,bg=#89b4fa,bold] #{mouse:?#[bg=#a6e3a1] 🖱 #[default]}#S #[fg=#89b4fa,bg=#1e1e2e,nobold]'
set -g status-left-length 40

set -g status-right '#{tmux_mode_indicator}#[fg=#1e1e2e,bg=#a6e3a1] #H #[fg=#a6e3a1,bg=#1e1e2e]#[fg=#cdd6f4] %Y-%m-%d %H:%M '
set -g status-right-length 200

setw -g window-status-current-style 'fg=#1e1e2e,bg=#89b4fa'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=#a6adc8,bg=#1e1e2e'
setw -g window-status-format ' #I #[fg=#cdd6f4]#W #[fg=#a6adc8]#F '
setw -g window-status-bell-style 'fg=#1e1e2e,bg=#f38ba8,bold'

# toggle mouse on/off with prefix + Ctrl+m (Enter)
bind C-m set -g mouse

# messages
set -g message-style 'fg=#cdd6f4,bg=#45475a'
set -g message-command-style 'fg=#cdd6f4,bg=#45475a'

# prefix + 4 => split current pane into 4 equal panes (2x2 grid)
# prefix + 3 => split into 3 panes (left column, right column split horizontally)
bind 3 split-window -h -c "#{pane_current_path}" \; \
        split-window -v -c "#{pane_current_path}" \; \
        select-pane -L

# prefix + 4 => split current pane into 4 equal panes (2x2 grid)
bind 4 split-window -h -c "#{pane_current_path}" \; \
        split-window -v -c "#{pane_current_path}" \; \
        select-pane -L \; \
        split-window -v -c "#{pane_current_path}" \; \
        select-layout tiled

# prefix + e => close the selected pane
bind e kill-pane

# prefix + b => close all panes except the active one
bind b kill-pane -a

# copy mode: vim-style visual selection, Enter copies selection to system clipboard
set -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/tmux-copy"

# ========================
# Session management
# ========================

# Killing the session you are attached to moves this client to another session
# instead of throwing you out of tmux entirely.
set -g detach-on-destroy off

# prefix + s => fzf session manager in a popup
#   enter switch | ctrl-x kill | ctrl-n new | ctrl-r rename | tab multi-select
bind s display-popup -E -w 85% -h 75% "$HOME/.local/bin/tmux-sessions"

# prefix + S => tmux's own session/window tree (what prefix + s used to be)
bind S choose-tree -Zs

# prefix + X => kill the current session, after a confirmation
bind X confirm-before -p "kill session '#S'? (y/n)" kill-session

# Persist a deletion the moment it happens.
#
# tmux-continuum saves on status-line redraws, so its save file lags by up to
# @continuum-save-interval -- and stops updating at all when no client is
# attached. Kill a session, quit tmux, and the next start restores it from that
# stale file. This hook re-saves whenever any session closes, by any route.
#
# It must go through the wrapper, never save.sh directly: this hook fires once
# per closing session, and save.sh deletes its own output when two copies run in
# the same second (see tmux-resurrect-save for the full explanation).
set-hook -g session-closed 'run-shell -b "$HOME/.local/bin/tmux-resurrect-save"'

# initialize TPM (MUST be last line)
run '~/.tmux/plugins/tpm/tpm'
